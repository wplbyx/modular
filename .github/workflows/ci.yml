name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Format
        run: go fmt ./...
      - name: Verify formatting
        run: git diff --exit-code
      - name: Tidy
        run: go mod tidy
      - name: Verify modules
        run: git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.x"
      - name: Test modular CLI
        if: runner.os == 'Linux'
        run: python -m unittest agent.modular.tests.test_modular_cli
