Application:
  Name: "custom-modular-monolith"
  Mode: "prod"
  Version: "v1.0.0"
  ShutdownTimeout: "10s"

Logging:
  Level: "info"
  Output:
    - "console"
  File:
    Filename: "./logs/app.log"
    MaxSize: 200
    MaxBackups: 7
    MaxAge: 15
    Compress: true
    SplitRange: "daily"
  OTel:
    Endpoint: ""
    Insecure: true

Database:
  DSN: "postgres://user:password@db1.example.com:5432/mydb?sslmode=require"
  MaxOpenConn: 50
  MaxIdleConn: 10
  ConnMaxLifetime: "1h"
  ConnMaxIdleTime: "30m"

Redis:
  Host: "127.0.0.1"
  Port: 6379
  Username: ""
  Password: "your-redis-password"
  Database: 0
  PoolSize: 10
  MinIdleConn: 5
  DialTimeout: "5s"
  ReadTimeout: "3s"
  WriteTimeout: "3s"
  MaxRetries: 3
  MinRetryBackoff: 8
  MaxRetryBackoff: 512

HTTP:
  Host: "0.0.0.0"
  Port: 18080
  ReadHeaderTimeout: "5s"
  ReadTimeout: "30s"
  WriteTimeout: "30s"
  IdleTimeout: "120s"
  ShutdownTimeout: "45s"
  EnableTLS: false
  TLSKeyFile: ""
  TLSCertFile: ""

GRPC:
  Host: "0.0.0.0"
  Port: 28080
  Timeout: "15s"
  ShutdownTimeout: "45s"
  EnableTLS: false
  TLSKeyFile: ""
  TLSCertFile: ""

Storage:
  Type: "disk"
  PublicBaseURL: "http://localhost:18080/files"
  Disk:
    RootDir: "./storage/upload"
    BaseUrl: "http://localhost:18080/files"
  OSS:
    AccessKeyID: ""
    AccessKeySecret: ""
    SecurityToken: ""
    Region: "cn-hangzhou"
    Bucket: ""
    Endpoint: "https://oss-cn-hangzhou.aliyuncs.com"
    BaseDir: ""
    DisableSSL: false
    UseCName: false
    Timeout: "60s"
    MaxRetries: 3

Kafka:
  Brokers:
    - "kafka1.example.com:9092"
    - "kafka2.example.com:9092"
  Producer:
    Topic: "order-events"
    RequiredAck: "all"
    Compression: "snappy"
    BatchSize: 200
    BatchTimeout: "20ms"
    Balancer: "hash"
  Consumer:
    Topic: "order-events"
    GroupID: "order-service-group"
    MinBytes: 10000
    MaxBytes: 10000000
    StartOffset: "newest"
    CommitInterval: 0
    MaxRetries: 5
    DLQTopic: "order-events-dlq"
